<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/img/home/icone.webp" />

    <title>Peanut Drinks — bebidas entregues geladas</title>
    <meta
      name="description"
      content="Catálogo de coquetéis, vinhos e bebidas sem álcool com entrega rápida. Projeto pessoal de Lucas Brandão em React e TypeScript."
    />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100e0b" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Peanut Drinks" />
    <meta
      property="og:description"
      content="Catálogo de coquetéis, vinhos e bebidas sem álcool com entrega rápida."
    />
    <meta property="og:image" content="/img/home/peanut-drinks.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=League+Spartan:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando o flash branco.
      ;(() => {
        try {
          const saved = localStorage.getItem('peanut-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch {
          /* localStorage bloqueado: segue no tema claro */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
